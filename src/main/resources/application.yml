# ============================================================================
# КОНФИГУРАЦИЯ ПРИЛОЖЕНИЯ SPRING BOOT
# ============================================================================

# ----------------------------------------------------------------------------
# НАСТРОЙКИ СЕРВЕРА
# ----------------------------------------------------------------------------
server:
  port: 8080  # Порт, на котором будет работать приложение
    # Можно изменить, если 8080 занят
  # Доступ: http://localhost:8080

# ----------------------------------------------------------------------------
# НАСТРОЙКИ БАЗЫ ДАННЫХ (PostgreSQL)
# ----------------------------------------------------------------------------
spring:
  datasource:
    # JDBC URL для подключения к PostgreSQL
    # Формат: jdbc:postgresql://host:port/database
    url: jdbc:postgresql://localhost:5432/user_service

    # Учетные данные для подключения
    username: postgres
    password: postgres

    # Драйвер JDBC (Spring Boot обычно сам определяет, но лучше указать явно)
    driver-class-name: org.postgresql.Driver

  # ----------------------------------------------------------------------------
  # НАСТРОЙКИ JPA/HIBERNATE
  # ----------------------------------------------------------------------------
  jpa:
    # hibernate.ddl-auto — управляет схемой БД:
    # - none: ничего не делать (для production)
    # - validate: проверить, что схема соответствует entity (безопасно)
    # - update: обновить схему, если entity изменились (удобно для dev)
    # - create: удалить и создать схему заново (данные теряются!)
    # - create-drop: создать при старте, удалить при остановке (для тестов)
    hibernate:
      ddl-auto: update  # Для разработки — автоматически обновляет схему

    # Показывать SQL-запросы в консоли (полезно для отладки)
    show-sql: true

    properties:
      hibernate:
        format_sql: true  # SQL в логах с отступами и переносами — легче читать при отладке

  # ----------------------------------------------------------------------------
  # НАСТРОЙКИ JACKSON (JSON-сериализация)
  # ----------------------------------------------------------------------------
  jackson:
    # Формат дат в JSON (ISO-8601)
    serialization:
      write-dates-as-timestamps: false
    # Включать только ненулевые поля (экономит трафик)
    default-property-inclusion: non_null

  # ----------------------------------------------------------------------------
  # НАСТРОЙКИ KAFKA (продюсер)
  # ----------------------------------------------------------------------------
  kafka:
    # Адреса брокеров для первичного подключения.
    # Клиент получит от брокера advertised listeners и дальше будет
    # работать с ними; здесь достаточно указать точку входа.
    bootstrap-servers: localhost:9092

    producer:
      # Сериализатор КЛЮЧА сообщения. Ключ (String) — это email пользователя:
      # по нему Kafka выбирает партицию, поэтому все события одного
      # пользователя попадают в одну партицию и сохраняют порядок.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer

      # Сериализатор ЗНАЧЕНИЯ сообщения. Выбран строковый сериализатор:
      # значением будет готовый JSON, собранный ObjectMapper'ом вручную.
      #
      # Альтернатива — JsonSerializer из spring-kafka, но он добавляет
      # в заголовки сообщения Spring-специфичные типы (spring_json_*),
      # что привязывает потребителя к Java/Spring. Plain JSON без заголовков —
      # язык-независимый контракт: consumer может быть написан на чём угодно.
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

# ----------------------------------------------------------------------------
# СОБСТВЕННЫЕ СВОЙСТВА ПРИЛОЖЕНИЯ (префикс app)
# ----------------------------------------------------------------------------
# Имена топиков вынесены в конфигурацию: код не содержит строковых
# констант, а смена имени топика не требует перекомпиляции.
app:
  kafka:
    topic-user-created: user-created
    topic-user-deleted: user-deleted



# ----------------------------------------------------------------------------
# НАСТРОЙКИ ЛОГИРОВАНИЯ
# ----------------------------------------------------------------------------
logging:
  level:
    # Уровень логирования для указанного пакета
    com.github.randir7.userservice: DEBUG

    # Уровень логирования для Hibernate (показывает SQL и параметры)
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

    # Уровень логирования для Spring
    org.springframework: INFO

# ----------------------------------------------------------------------------
# НАСТРОЙКИ ACTUATOR (мониторинг)
# ----------------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        # Открытие эндпоинтов для мониторинга (health, info, metrics)
        include: health,info

# ----------------------------------------------------------------------------
# SWAGGER / OPENAPI ДОКУМЕНТАЦИЯ (Springdoc OpenAPI)
# ----------------------------------------------------------------------------
#
# Springdoc OpenAPI автоматически сканирует все @RestController-классы
# и генерирует OpenAPI 3.0 спецификацию. Настройки ниже управляют
# только точками доступа и внешним видом веб-интерфейса.
#
# Метаинформация проекта (название, описание, версия) задаётся в отдельном
# конфигурационном Java-классе OpenApiConfig, а не здесь:
# для сложных объектов YAML менее удобен, чем явный код.
# ----------------------------------------------------------------------------
springdoc:
  # Путь к JSON-спецификации OpenAPI 3.0.
  # Используется клиентами (Postman, генераторы SDK, другие Swagger UI)
  # для программной работы с документацией.
  # Значение по умолчанию — /v3/api-docs; указано явно для наглядности.
  api-docs:
    path: /v3/api-docs

  # Настройки веб-интерфейса Swagger UI (HTML/JS страница для ручного тестирования).
  swagger-ui:
    # Путь к Swagger UI. Значение по умолчанию — /swagger-ui.html.
    path: /swagger-ui.html

    # Сортировка операций (эндпоинтов) внутри тега.
    # "method" — по HTTP-методу: GET → POST → PUT → DELETE.
    # Упорядочивает эндпоинты в логике REST-навигации по ресурсу.
    operations-sorter: method

    # Сортировка тегов (групп эндпоинтов).
    # "alpha" — по алфавиту. Полезно при большом количестве тегов.
    tags-sorter: alpha

    # Отключение примеров запросов по умолчанию (generated examples).
    # Значение false оставляет включёнными: Springdoc генерирует примеры
    # на основе @Schema-аннотаций DTO, что ускоряет ручное тестирование.
    # Для учебных проектов включённые примеры предпочтительнее.
    disable-swagger-default-url: true

  # ----------------------------------------------------------------------------
  # ОТКЛЮЧЕНИЕ АВТОМАТИЧЕСКИХ ЭНДПОИНТОВ ИЗ ДОКУМЕНТАЦИИ
  # ----------------------------------------------------------------------------
  #
  # Spring Boot Actuator и ошибки Whitelabel генерируют служебные эндпоинты
  # (/actuator/health, /error), которые засоряют документацию.
  # Параметр paths-to-exclude убирает их из Swagger UI и OpenAPI JSON.
  #
  # Если Actuator не подключён (в данном проекте endpoints include: health,info
  # включены), эндпоинт /actuator всё равно попадает в документацию.
  # paths-to-match, наоборот, ограничивает документацию только нужными путями:
  # в документацию попадут только эндпоинты, начинающиеся с /api/v1/users.
  # Это желательная практика: внутренняя и внешняя поверхности API разделены.
  # ----------------------------------------------------------------------------
  paths-to-match: /api/v1/**