# ============================================================================
# Инфраструктура для разработки: Kafka (брокер сообщений) + Mailpit (почта).
#
# Запуск:  docker compose up -d
# Останов: docker compose down
# Останов с удалением данных: docker compose down -v
#
# После запуска будут доступны:
# - Kafka: localhost:9092 (для приложений)
# - Mailpit SMTP: localhost:1025 (для отправки писем из приложения)
# - Mailpit UI: http://localhost:8025 (веб-интерфейс для просмотра писем)
# ============================================================================

services:
  kafka:
    # JVM-сборка официального образа: содержит полный дистрибутив Kafka
    # со всеми CLI-инструментами (kafka-topics.sh, kafka-console-consumer.sh и др.).
    #
    # Почему не apache/kafka-native: нативная GraalVM-сборка урезана —
    # в ней отсутствуют привычные скрипты bin/*.sh, из-за чего невозможно
    # выполнять административные команды внутри контейнера и строить
    # healthcheck на них. Native-образ хорош в production, где CLI не нужен.
    image: apache/kafka:4.0.0
    container_name: user-service-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      # Каталог хранения данных Kafka (логи-сегменты топиков).
      # Указан ЯВНО, чтобы совпасть с точкой монтирования volume ниже:
      # без этой настройки образ мог писать данные в свой каталог по умолчанию,
      # и volume оставался бы пустым — данные терялись бы при пересоздании контейнера.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # В JVM-образе скрипт существует по этому пути, проверка корректна.
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list" ]
      interval: 10s
      timeout: 5s
      retries: 5


  # ============================================================================
  # MAILPIT
  # ============================================================================
  #
  # Локальный почтовый сервер-заглушка. Принимает письма по SMTP, но НЕ
  # отправляет их в интернет — складывает во внутренний "ящик", который
  # можно просматривать через веб-интерфейс.
  #
  # Зачем нужен Mailpit, а не реальный SMTP:
  # 1. Письма не уйдут реальным людям по ошибке (безопасность).
  # 2. Не нужны SMTP-аккаунты Gmail/Yandex.
  # 3. Удобно отлаживать: открыл браузер, увидел письмо, проверил шаблон.
  # 4. Работает оффлайн.
  #
  # Альтернативы: MailHog (старше, не обновляется), MailDev (Node.js-based),
  # GreenMail (для тестов). Mailpit — самый современный из них.
  #
  mailpit:
    image: axllent/mailpit:latest
    container_name: user-service-mailpit
    ports:
      # 1025 — SMTP-порт, к которому подключается Spring Boot
      # (настройка spring.mail.port).
      - "1025:1025"
      # 8025 — HTTP-порт веб-интерфейса.
      # Открыв http://localhost:8025 можно увидеть все "отправленные" письма.
      - "8025:8025"
    environment:
      # Ограничение размера "ящика": хранить не более 500 последних писем.
      # Старые будут автоматически удаляться.
      MP_MAX_MESSAGES: 500

# ============================================================================
# ОБЪЯВЛЕНИЕ VOLUMES (верхний уровень файла)
# ============================================================================
#
# Здесь перечисляются все именованные volumes, используемые в сервисах выше.
# Docker создаст их автоматически при первом запуске и будет хранить данные
# между перезапусками контейнеров.
#
# Структура Docker Compose требует, чтобы ВСЕ volumes, на которые ссылаются
# сервисы, были ОБЪЯВЛЕНЫ здесь, на верхнем уровне. Иначе возникает ошибка:
# "service X refers to undefined volume Y".
#
# Синтаксис:
# volumes:
#   имя-volume:        ← объявление (двоеточие после имени обязательно)
#     driver: local    ← опциональные настройки (здесь используем умолчания)
#
# Без дополнительных настроек (пустое значение после двоеточия) Docker
# использует драйвер по умолчанию (local) и создаёт volume в системной
# директории Docker.
#
# Управление volumes:
# - Список всех volumes: docker volume ls
# - Удалить volume: docker volume rm имя-volume
# - Удалить все volumes проекта: docker compose down -v (флаг -v)
# ============================================================================
volumes:
  # Volume для данных Kafka. Имя локально для проекта
  # (docker compose добавит префикс директории, где лежит compose-файл).
  kafka-data: